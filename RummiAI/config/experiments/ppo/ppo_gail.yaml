# PPO gail configuration file.  
behaviors:
  PlayRummikub:
    trainer_type: ppo

    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      memory:
        sequence_length: 32
        memory_size: 128

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      gail:
        strength: 0.4
        gamma: 0.99
        demo_path: Recording/bufferObs/RummikubExpert.demo
        learning_rate: 1.0e-4
        use_actions: true
        use_vail: false

    max_steps: 2000000
    checkpoint_interval: 25000
    keep_checkpoints: 125
    time_horizon: 256
    summary_freq: 10000

    threaded: true

env_settings:
  seed: 42

environment_parameters:
  level:
    curriculum:
      - name: Level0
        value: 0
        completion_criteria:
          measure: reward
          behavior: PlayRummikub
          threshold: 0.7
          min_lesson_length: 500
          signal_smoothing: true
          require_reset: false
